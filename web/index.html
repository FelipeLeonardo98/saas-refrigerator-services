/* ============================================================
   REGRA DE BTU (ver docs/specs/04-btu-rule.md)
   ============================================================ */
const BTU_PARAMS = { btuPorM2:600, btuPorPessoaExtra:600, btuPorEletronico:600, fatorSolTarde:200,
  capacidades:[7000,9000,12000,18000,22000,24000,30000,36000,48000,60000] };
function estimarBTU({ areaM2=0, people=0, electronics=0, sunExposure='manha' }){
  const base = areaM2 * BTU_PARAMS.btuPorM2;
  const pessoas = Math.max(0, people-2) * BTU_PARAMS.btuPorPessoaExtra;
  const aparelhos = electronics * BTU_PARAMS.btuPorEletronico;
  const sol = sunExposure === 'tarde' ? areaM2 * BTU_PARAMS.fatorSolTarde : 0;
  const bruto = base + pessoas + aparelhos + sol;
  const cap = BTU_PARAMS.capacidades.find(c => c >= bruto);
  return { bruto, btu: cap || null, excede: !cap };
}

// URL + publishable key são PÚBLICAS (a publishable key é feita para o browser,
// protegida por RLS). Não é segredo — pode ficar no front.
const SB_URL = 'https://drfbhcqumbowjzmykvdl.supabase.co';
const SB_KEY = 'sb_publishable_Qn5N7S29qZoKUnfRO8yO6w_L4FIn4aX';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
let TENANT_ID = 'eco';

// mapeamento camelCase <-> snake_case (só chaves de topo; jsonb fica intacto)
const toSnake = o => { const r={}; for(const k in o) r[k.replace(/[A-Z]/g,m=>'_'+m.toLowerCase())]=o[k]; return r; };
const toCamel = o => { const r={}; for(const k in o) r[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())]=o[k]; return r; };

// chave no estado : nome da tabela, em ordem segura de FK
const TABLES = [['customers','customers'],['sites','sites'],['equipment','equipment'],['leads','leads'],['quotes','quotes'],['serviceOrders','service_orders'],['reminders','reminders']];
const rowOf = o => { const c={...o}; delete c.items; delete c.media; return toSnake(c); };
const EMPTY = {tenant:null,customers:[],sites:[],equipment:[],leads:[],quotes:[],serviceOrders:[],reminders:[]};

async function loadAll(){
  const names=['tenants','customers','sites','equipment','leads','quotes','quote_line_items','service_orders','reminders','media'];
  const res = await Promise.all(names.map(n=>sb.from(n).select('*')));
  const bad = res.find(r=>r.error); if(bad) throw bad.error;
  const [tenants,customers,sites,equipment,leads,quotes,lineItems,serviceOrders,reminders,media] = res.map(r=>r.data);
  const tenant = tenants[0] ? toCamel(tenants[0]) : {id:'eco',name:'EcoTherm'};
  TENANT_ID = tenant.id;
  const mediaBy={}; media.forEach(m=>{ (mediaBy[m.owner_id]=mediaBy[m.owner_id]||[]).push({id:m.id,kind:m.kind,url:m.url}); });
  const itemsBy={}; lineItems.forEach(li=>{ (itemsBy[li.quote_id]=itemsBy[li.quote_id]||[]).push(toCamel(li)); });
  return {
    tenant,
    customers: customers.map(toCamel),
    sites: sites.map(toCamel),
    equipment: equipment.map(toCamel),
    leads: leads.map(l=>{ const c=toCamel(l); c.media=mediaBy[l.id]||[]; return c; }),
    quotes: quotes.map(q=>{ const c=toCamel(q); c.items=itemsBy[q.id]||[]; return c; }),
    serviceOrders: serviceOrders.map(toCamel),
    reminders: reminders.map(toCamel),
  };
}

// sincroniza as diferenças entre dois estados para o Supabase
async function syncDiff(prev, next){
  for(const [key,table] of TABLES){                 // upserts (ordem de FK)
    const p=prev[key]||[], n=next[key]||[];
    const pBy=Object.fromEntries(p.map(r=>[r.id,r]));
    const ups=n.filter(r=>{ const b=pBy[r.id]; return !b || JSON.stringify(b)!==JSON.stringify(r); }).map(rowOf);
    if(ups.length){ const {error}=await sb.from(table).upsert(ups); if(error) throw error; }
  }
  for(const q of next.quotes||[]){                  // itens do orçamento
    const b=(prev.quotes||[]).find(x=>x.id===q.id);
    if(!b || JSON.stringify(b.items||[])!==JSON.stringify(q.items||[])){
      await sb.from('quote_line_items').delete().eq('quote_id',q.id);
      const rows=(q.items||[]).map(it=>({ id:it.id||uid(), quote_id:q.id, category:it.category, description:it.description, amount:it.amount }));
      if(rows.length){ const {error}=await sb.from('quote_line_items').insert(rows); if(error) throw error; }
    }
  }
  for(const l of next.leads||[]){                   // mídia de leads novos
    if(!(prev.leads||[]).some(x=>x.id===l.id) && (l.media||[]).length){
      const rows=l.media.map(m=>({ id:m.id||uid(), tenant_id:TENANT_ID, owner_type:'lead', owner_id:l.id, kind:m.kind, url:m.url }));
      const {error}=await sb.from('media').insert(rows); if(error) throw error;
    }
  }
  for(const [key,table] of [...TABLES].reverse()){   // deletes (ordem reversa)
    const nBy=Object.fromEntries((next[key]||[]).map(r=>[r.id,true]));
    for(const r of (prev[key]||[])) if(!nBy[r.id]){ const {error}=await sb.from(table).delete().eq('id',r.id); if(error) throw error; }
  }
}

const Store = createContext(null);
function useStore(){ return useContext(Store); }
function StoreProvider({children}){
  const [db,setDb] = useState(null);
  const [bootErr,setBootErr] = useState(null);
  const [toasts,setToasts] = useState([]);
  const toast = (msg,kind='ok') => { const id=uid(); setToasts(t=>[...t,{id,msg,kind}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3800); };

  useEffect(()=>{ (async()=>{
    try{
      let data = await loadAll();
      if(data.customers.length===0){                 // 1ª vez: semeia o banco
        const s = seed();
        await syncDiff({...EMPTY, tenant:data.tenant}, s);
        data = await loadAll();
      }
      setDb(data);
    }catch(e){ console.error('[boot]',e); setBootErr(e.message||String(e)); }
  })(); },[]);

  const mutate = fn => setDb(prev => {
    const next = fn(structuredClone(prev));
    syncDiff(prev,next).catch(e=>{ console.error('[sync]',e); toast('Falha ao salvar no banco.','warn'); });
    return next;
  });

  const reset = async () => {
    try{
      for(const t of ['media','quote_line_items','reminders','service_orders','quotes','leads','equipment','sites','customers'])
        await sb.from(t).delete().neq('id','00000000-0000-0000-0000-000000000000');
      const s = seed();
      await syncDiff({...EMPTY, tenant:db.tenant}, s);
      setDb(await loadAll());
      toast('Dados resetados.');
    }catch(e){ console.error('[reset]',e); toast('Falha ao resetar.','warn'); }
  };

  if(bootErr) return (
    <div className="min-h-screen flex items-center justify-center p-6 text-center">
      <div><div className="font-bold text-red-600">Não consegui conectar ao banco</div>
      <div className="text-sm text-slate-500 mt-2 max-w-md break-words">{bootErr}</div></div>
    </div>);
  if(db===null) return (
    <div className="min-h-screen flex items-center justify-center">
      <div className="flex items-center gap-3 text-slate-400"><Logo size={34}/><span className="animate-pulse">Carregando…</span></div>
    </div>);

  return <Store.Provider value={{db,mutate,toast,reset}}>
    {children}
    <div className="fixed bottom-4 right-4 z-50 space-y-2">
      {toasts.map(t=>(
        <div key={t.id} className={"px-4 py-3 rounded-xl shadow-card text-sm text-white flex items-center gap-2 "+(t.kind==='ok'?'bg-aqua-700':'bg-slate-800')}>
          <Ic n="check"/> {t.msg}
        </div>
      ))}
    </div>
  </Store.Provider>;
}

function QuoteForm({onDone,onCancel}){
  const { mutate, toast, db } = useStore();
  const [step,setStep] = useState(1);
  const [serviceType,setServiceType] = useState(null);
  const [env,setEnv] = useState({ areaM2:'', people:'', electronics:'', sunExposure:'manha', ceilingHeight:'', notes:'' });
  const [media,setMedia] = useState([]);
  const [contact,setContact] = useState({ name:'', type:'PF', document:'', email:'', phone:'' });

  const btu = useMemo(()=>{
    if(serviceType!=='instalacao') return null;
    return estimarBTU({ areaM2:+env.areaM2||0, people:+env.people||0, electronics:+env.electronics||0, sunExposure:env.sunExposure });
  },[serviceType,env]);

  const onFiles = e => {
    const files=[...e.target.files].slice(0,4);
    Promise.all(files.map(f=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res({kind:f.type.startsWith('video')?'video':'foto',url:r.result}); r.readAsDataURL(f); })))
      .then(arr=>setMedia(m=>[...m,...arr].slice(0,6)));

  const submit = () => {
    if(!contact.name || (!contact.email && !contact.phone)){ toast('Informe nome e ao menos um contato.','warn'); return; }
    const protocol = 'ECO-' + Math.random().toString(36).slice(2,6).toUpperCase();
    const lead = {
      id:uid('lead'), tenantId:TENANT_ID, protocol, customerId:null,
      snapshotName:contact.name, snapshotEmail:contact.email, snapshotPhone:contact.phone, snapshotType:contact.type,
      serviceType,
      environment: serviceType==='instalacao'

        : { notes:env.notes },
      estimatedBtu: btu? btu.btu : null, media, status:'novo', createdAt: nowISO(),

            <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
            <Btn onClick={()=>setStep(2)} disabled={!stepOk}>Continuar</Btn>

      {step===2 && (

          <h2 className="text-xl font-bold">Sobre o ambiente</h2>
          {serviceType==='instalacao' ? (
            <>
              <div className="grid sm:grid-cols-2 gap-4 mt-5">
                <Field label="Área do ambiente (m²)"><Input type="number" value={env.areaM2} onChange={e=>setEnv({...env,areaM2:e.target.value})} placeholder="ex: 20"/></Field>
                <Field label="Pessoas no ambiente"><Input type="number" value={env.people} onChange={e=>setEnv({...env,people:e.target.value})} placeholder="ex: 4"/></Field>
                <Field label="Eletrônicos que esquentam" hint="TV, computador, forno..."><Input type="number" value={env.electronics} onChange={e=>setEnv({...env,electronics:e.target.value})} placeholder="ex: 2"/></Field>
                <Field label="Exposição ao sol">
                  <Select value={env.sunExposure} onChange={e=>setEnv({...env,sunExposure:e.target.value})}>
                    <option value="manha">Sol da manhã / sombra</option>
                    <option value="tarde">Sol da tarde (mais quente)</option>
                  </Select>
                </Field>
              </div>
              {btu && +env.areaM2>0 && (
                <div className="mt-5 p-4 rounded-xl bg-aqua-100/60 border border-aqua-300/40">
                  <div className="text-sm text-aqua-700 font-semibold flex items-center gap-2"><Ic n="snow"/>Estimativa de capacidade</div>

      )}

      {step===3 && (
        <Card className="p-7">
          <h2 className="text-xl font-bold">Seus dados de contato</h2>

          </div>
          <div className="flex justify-between mt-7">
            <Btn variant="ghost" onClick={()=>setStep(2)}>Voltar</Btn>

function TrackOrder({initial,onHome}){
  const { db } = useStore();
  const [q,setQ] = useState(initial||'');
  const [found,setFound] = useState(null);
  const [searched,setSearched] = useState(false);
  const search = () => {
    const t=q.trim().toLowerCase();
    const lead = db.leads.find(l => l.protocol.toLowerCase()===t || (l.snapshotEmail||'').toLowerCase()===t || (l.snapshotPhone||'').replace(/\D/g,'')===t.replace(/\D/g,'') && t);
    setFound(lead||null); setSearched(true);
  };
  const steps = ['novo','qualificado','orcamento_enviado','aprovado'];
  return (
    <div className="max-w-xl mx-auto px-4 py-12">
      <h2 className="text-2xl font-extrabold">Acompanhar pedido</h2>
      <p className="text-slate-500 mt-1 text-sm">Informe seu protocolo (ex: ECO-7F3K) ou e-mail/telefone.</p>
      <div className="flex gap-2 mt-4">
        <Input value={q} onChange={e=>setQ(e.target.value)} placeholder="ECO-XXXX ou e-mail/telefone" onKeyDown={e=>e.key==='Enter'&&search()}/>
        <Btn onClick={search}>Buscar</Btn>
      </div>
      {searched && !found && <Card className="p-6 mt-5 text-center text-slate-500 text-sm">Nenhum pedido encontrado. Confira o protocolo.</Card>}
      {found && (
        <Card className="p-6 mt-5">
          <div className="flex items-center justify-between">
            <div><div className="font-bold">{found.snapshotName}</div><div className="text-xs text-slate-400">{SERVICE_LABEL[found.serviceType]} · {found.protocol}</div></div>
            <Badge tone={LEAD_STATUS[found.status]?.tone}>{LEAD_STATUS[found.status]?.label}</Badge>
          </div>
          <div className="mt-6 space-y-0">
            {steps.map((s,i)=>{
              const done = steps.indexOf(found.status)>=i || found.status==='aprovado';
              const current = found.status===s;
              return (
                <div key={s} className="flex items-start gap-3">
                  <div className="flex flex-col items-center">
                    <div className={"w-7 h-7 rounded-full flex items-center justify-center text-white "+(done?'brand-gradient':'bg-slate-200')}>{done?<Ic n="check" className="w-4 h-4"/>:<span className="text-xs">{i+1}</span>}</div>
                    {i<steps.length-1 && <div className="w-0.5 h-8" style={{background: done?'#29ABE2':'#e2e8f0'}}/>}
                  </div>
                  <div className={"pt-0.5 "+(current?'font-bold':'')}>{LEAD_STATUS[s].label}</div>
                </div>
              );
            })}
          </div>
        </Card>
      )}
      <Btn variant="ghost" className="mt-5" onClick={onHome}><span className="inline-flex items-center gap-1.5"><Ic n="back"/>Início</span></Btn>
    </div>
  );
}

function useDerived(){
  const { db } = useStore();
  return useMemo(()=>{
    const custById = Object.fromEntries(db.customers.map(c=>[c.id,c]));
    const weekOrders = db.serviceOrders.filter(o=>o.status!=='concluido' && o.scheduledFor && daysUntil(o.scheduledFor)>=-1 && daysUntil(o.scheduledFor)<=7);
    const monthEarnings = db.serviceOrders.filter(o=>o.status==='concluido' && daysUntil(o.completedAt)>=-31).reduce((s,o)=>s+o.amount,0)
      + db.quotes.filter(q=>q.status==='aprovado').reduce((s,q)=>s+q.total,0);
    const attention = db.equipment.map(eq=>{
      const nm = nextMaint(eq); const du = nm? daysUntil(nm): null;
      return { eq, nm, du, customer:custById[eq.customerId] };
    }).filter(x=>x.du!==null && x.du<=30).sort((a,b)=>a.du-b.du);
    const newLeads = db.leads.filter(l=>l.status==='novo');
    return { custById, weekOrders, monthEarnings, attention, newLeads };
  },[db]);
}

const CAT_LABEL = { equipamento:'Equipamento', material:'Material / Insumos', mao_de_obra:'Mão de obra', local:'Local / Infra', deslocamento:'Deslocamento', outro:'Outro' };
function QuoteBuilder({leadId,open}){
  const { db, mutate, toast } = useStore();
  const lead = db.leads.find(l=>l.id===leadId);
  const existing = db.quotes.find(q=>q.leadId===leadId);
  const [items,setItems] = useState(existing? existing.items : [
    { id:uid('li'), category:'equipamento', description:'', amount:'' },
    { id:uid('li'), category:'mao_de_obra', description:'', amount:'' },
  ]);
  const [sent,setSent] = useState(null); // { msg } após gerar o envio
  const total = items.reduce((s,i)=>s+(+i.amount||0),0);
  const addItem = () => setItems([...items,{id:uid('li'),category:'material',description:'',amount:''}]);
  const upd = (id,k,v) => setItems(items.map(i=>i.id===id?{...i,[k]:v}:i));
  const del = id => setItems(items.filter(i=>i.id!==id));

  const buildMsg = (clean,tot) => {
    const lines = clean.map(i=>`• ${CAT_LABEL[i.category]}: ${i.description} — ${fmtBRL(i.amount)}`).join('\n');
    return `Olá, ${lead.snapshotName}! Aqui é a EcoTherm.\n\nSegue o seu orçamento (${SERVICE_LABEL[lead.serviceType]}):\n\n${lines}\n\nTotal: ${fmtBRL(tot)}\nValidade: 10 dias.\nProtocolo: ${lead.protocol}\n\nQualquer dúvida, estou à disposição!`;
  };

  const send = () => {
    const clean = items.filter(i=>i.description && +i.amount>0).map(i=>({...i,amount:+i.amount}));
    if(clean.length===0){ toast('Adicione ao menos um item válido.','warn'); return; }
    const tot = clean.reduce((s,i)=>s+i.amount,0);
    mutate(d=>{
      const l = d.leads.find(x=>x.id===leadId); l.status='orcamento_enviado';
      let q = d.quotes.find(q=>q.leadId===leadId);
      const payload = { items:clean, total:tot, status:'enviado' };
      if(q){ Object.assign(q,payload); } else { d.quotes.push({ id:uid('quote'), tenantId:TENANT_ID, leadId, customerId:l.customerId||null, validUntil:addDays(nowISO(),10), createdAt:nowISO(), ...payload }); }
      return d;
    });
    setSent({ msg: buildMsg(clean,tot) });
  };

  return (
    <div className="max-w-3xl">
      <Btn variant="ghost" onClick={()=>open('leads',{leadId})}><span className="inline-flex items-center gap-1.5"><Ic n="back"/>Voltar ao lead</span></Btn>
      <h1 className="text-2xl font-extrabold mt-3">Orçamento — {lead?.snapshotName}</h1>
      <p className="text-slate-500 text-sm">Detalhe o serviço em itens. O cliente vê o breakdown — transparência gera confiança.</p>

      <Card className="p-4 sm:p-5 mt-5">
        <div className="space-y-3">
          {items.map(i=>(
            <div key={i.id} className="grid grid-cols-12 gap-2 items-center">
              <div className="col-span-7 sm:col-span-3 sm:order-1"><Select value={i.category} onChange={e=>upd(i.id,'category',e.target.value)}>{Object.entries(CAT_LABEL).map(([v,l])=><option key={v} value={v}>{l}</option>)}</Select></div>
              <div className="col-span-4 sm:col-span-2 sm:order-3"><Input type="number" value={i.amount} onChange={e=>upd(i.id,'amount',e.target.value)} placeholder="R$"/></div>
              <div className="col-span-1 sm:order-4 text-right"><button onClick={()=>del(i.id)} aria-label="Remover" className="text-slate-300 hover:text-red-500 text-lg">×</button></div>
              <div className="col-span-12 sm:col-span-6 sm:order-2"><Input value={i.description} onChange={e=>upd(i.id,'description',e.target.value)} placeholder="Descrição do item"/></div>
            </div>
          ))}
        </div>
        <Btn variant="soft" className="mt-3" onClick={addItem}><span className="inline-flex items-center gap-1.5"><Ic n="plus"/>Adicionar item</span></Btn>

        <div className="mt-5 pt-5 border-t border-slate-100 flex items-center justify-between">
          <div className="text-sm text-slate-500">Total do orçamento</div>
          <div className="text-2xl font-extrabold brand-text">{fmtBRL(total)}</div>
        </div>
      </Card>
      <div className="flex flex-col sm:flex-row sm:justify-end gap-2 mt-4">
        <Btn variant="outline" onClick={()=>open('leads',{leadId})}>Cancelar</Btn>
        <Btn onClick={send}><span className="inline-flex items-center justify-center gap-2"><Ic n="mail"/>Enviar ao cliente</span></Btn>
      </div>

      {sent && <SendQuoteModal msg={sent.msg} phone={lead.snapshotPhone} email={lead.snapshotEmail}
        onClose={()=>{ toast('Orçamento registrado como enviado.'); open('leads',{leadId}); }}/>}
    </div>
  );
}

      {/* equipamentos (prontuário) */}
      <h2 className="font-bold mt-7 mb-3 flex items-center gap-2"><Ic n="snow" className="w-4 h-4 text-aqua-500"/>Equipamentos</h2>
      <div className="grid sm:grid-cols-2 gap-4">
        {equipment.length===0 && <div className="text-sm text-slate-400">Nenhum equipamento registrado ainda.</div>}
        {equipment.map(eq=>{
          const nm = nextMaint(eq); const du = nm? daysUntil(nm): null;
          return (
            <Card key={eq.id} className="p-5">
              <div className="flex items-center justify-between">
                <div className="font-bold">{eq.brand} {eq.model}</div>
                <Badge tone="blue">{eq.btu.toLocaleString('pt-BR')} BTU</Badge>
              </div>
              <div className="grid grid-cols-2 gap-3 mt-3 text-sm">
                <Info label="Tipo" value={eq.type}/>
                <Info label="Instalado em" value={fmtDate(eq.installedAt)}/>
                <Info label="Última manutenção" value={fmtDate(eq.lastMaintenanceAt)}/>
                <Info label="Garantia até" value={fmtDate(eq.warrantyUntil)}/>
              </div>
              <div className="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
                <span className="text-xs text-slate-400">Próxima manutenção: {fmtDate(nm)}</span>
                {du!==null && <Badge tone={du<0?'red':du<=30?'amber':'green'}>{du<0?`${Math.abs(du)}d atrasada`:`em ${du}d`}</Badge>}
              </div>
            </Card>
          );
        })}
      </div>

      {/* histórico de serviços */}
      <h2 className="font-bold mt-8 mb-3 flex items-center gap-2"><Ic n="file" className="w-4 h-4 text-violet-500"/>Histórico de serviços</h2>
      <Card className="p-2">
        {orders.length===0 && <div className="text-sm text-slate-400 p-4 text-center">Sem serviços registrados.</div>}
        {orders.map(o=>(
          <div key={o.id} className="flex items-center justify-between p-3 border-b border-slate-50 last:border-0">
            <div>
              <div className="font-semibold text-sm">{SERVICE_LABEL[o.serviceType]} <span className="text-xs text-slate-400 font-normal">· {o.notes}</span></div>
              <div className="text-xs text-slate-400">{o.status==='concluido'? 'Concluído em '+fmtDate(o.completedAt) : 'Agendado para '+fmtDate(o.scheduledFor)}</div>
            </div>
            <div className="flex items-center gap-3">
              <span className="font-semibold text-sm">{fmtBRL(o.amount)}</span>
              {o.status==='concluido' ? <Badge tone="green">Concluído</Badge>
                : <Btn variant="soft" onClick={()=>setOsModal(o)}>Concluir & lembrete</Btn>}
            </div>
          </div>
        ))}
      </Card>

      {quotes.length>0 && (
        <>
          <h2 className="font-bold mt-8 mb-3 flex items-center gap-2"><Ic n="money" className="w-4 h-4 text-green-500"/>Orçamentos</h2>
          <Card className="p-2">
            {quotes.map(q=>(
              <div key={q.id} className="flex items-center justify-between p-3 border-b border-slate-50 last:border-0">
                <div className="text-sm text-slate-500">{q.items.length} itens · {fmtDate(q.createdAt)}</div>
                <div className="flex items-center gap-3"><span className="font-semibold">{fmtBRL(q.total)}</span><Badge tone={q.status==='aprovado'?'green':q.status==='enviado'?'amber':'slate'}>{q.status}</Badge></div>
              </div>
            ))}
          </Card>
        </>
      )}

      {osModal && <ConcludeModal order={osModal} customer={c} onClose={()=>setOsModal(null)}/>}
    </div>
  );
}

function ConcludeModal({order,customer,onClose}){
  const { db, mutate, toast } = useStore();
  const eqExisting = db.equipment.find(e=>e.id===order.equipmentId);
  const [eq,setEq] = useState(eqExisting || { brand:'', model:'', btu:'', type:'split', maintenanceIntervalDays:120 });
  const [rem,setRem] = useState({ enabled:true, leadDays:7, channel:'email' });

  const finish = () => {
    mutate(d=>{
      const o = d.serviceOrders.find(x=>x.id===order.id);
      o.status='concluido'; o.completedAt=nowISO();
      o.reminderEnabled=rem.enabled; o.reminderLeadDays=+rem.leadDays; o.reminderChannel=rem.channel;
      // cria/atualiza equipamento
      let equip = d.equipment.find(e=>e.id===o.equipmentId);
      if(!equip){
        equip = { id:uid('eq'), tenantId:TENANT_ID, customerId:customer.id, siteId:null, brand:eq.brand, model:eq.model, btu:+eq.btu||0, type:eq.type,
          installedAt:nowISO(), warrantyUntil:addDays(nowISO(),365), lastMaintenanceAt:nowISO(), maintenanceIntervalDays:+eq.maintenanceIntervalDays||120, status:'ativo' };
        d.equipment.push(equip); o.equipmentId=equip.id;
      } else {
        equip.lastMaintenanceAt=nowISO(); equip.maintenanceIntervalDays=+eq.maintenanceIntervalDays||equip.maintenanceIntervalDays;
      }
      if(rem.enabled){
        d.reminders.push({ id:uid('rem'), tenantId:TENANT_ID, customerId:customer.id, equipmentId:equip.id, serviceOrderId:o.id,
          dueAt: nextMaint(equip), leadDays:+rem.leadDays, channel:rem.channel, status:'agendado' });
      }
      return d;
    });
    toast(rem.enabled? `OS concluída. Lembrete agendado (${rem.channel}, ${rem.leadDays}d antes).` : 'OS concluída.');
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4" onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="bg-white rounded-2xl shadow-card max-w-lg w-full p-6 max-h-[90vh] overflow-auto">
        <h3 className="text-lg font-bold">Concluir serviço & configurar lembrete</h3>
        <p className="text-sm text-slate-500 mb-4">Ao concluir, o equipamento entra no prontuário e o lembrete de manutenção é agendado.</p>

        <div className="text-xs font-semibold text-slate-400 uppercase mb-2">Equipamento</div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Marca"><Input value={eq.brand} onChange={e=>setEq({...eq,brand:e.target.value})} placeholder="ex: Fujitsu"/></Field>
          <Field label="Modelo"><Input value={eq.model} onChange={e=>setEq({...eq,model:e.target.value})} placeholder="ex: Inverter 12k"/></Field>
          <Field label="BTU"><Input type="number" value={eq.btu} onChange={e=>setEq({...eq,btu:e.target.value})} placeholder="12000"/></Field>
          <Field label="Tipo"><Select value={eq.type} onChange={e=>setEq({...eq,type:e.target.value})}><option>split</option><option>janela</option><option>cassete</option><option>multi</option><option>outro</option></Select></Field>
        </div>

        <div className="text-xs font-semibold text-slate-400 uppercase mt-5 mb-2">Lembrete de manutenção</div>
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={rem.enabled} onChange={e=>setRem({...rem,enabled:e.target.checked})}/> Agendar lembrete automático</label>
        {rem.enabled && (
          <div className="grid grid-cols-3 gap-3 mt-3">
            <Field label="Intervalo (dias)"><Input type="number" value={eq.maintenanceIntervalDays} onChange={e=>setEq({...eq,maintenanceIntervalDays:e.target.value})}/></Field>
            <Field label="Avisar antes (dias)"><Input type="number" value={rem.leadDays} onChange={e=>setRem({...rem,leadDays:e.target.value})}/></Field>
            <Field label="Canal"><Select value={rem.channel} onChange={e=>setRem({...rem,channel:e.target.value})}><option value="email">E-mail</option><option value="whatsapp">WhatsApp</option><option value="ambos">Ambos</option></Select></Field>
          </div>
        )}
        {rem.enabled && <p className="text-xs text-slate-400 mt-2">Litoral: intervalo menor (90–120d) por causa da maresia.</p>}

        <div className="flex justify-end gap-2 mt-6">
          <Btn variant="outline" onClick={onClose}>Cancelar</Btn>
          <Btn onClick={finish}><span className="inline-flex items-center gap-2"><Ic n="check"/>Concluir</span></Btn>
        </div>
      </div>
    </div>
  );
}

<script>
  // Transforma o JSX com runtime "classic" (React.createElement), evitando
  // o "automatic runtime" do Babel novo, que injeta import e quebra em script inline.
  (function(){
    try {
      var src = document.getElementById('appSource').textContent;
      var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
      var s = document.createElement('script');
      s.textContent = out;
      document.body.appendChild(s);
    } catch (e) {
      console.error(e);
      document.getElementById('root').innerHTML =
        '<pre style="padding:20px;color:#b91c1c;white-space:pre-wrap;font-family:monospace">Erro ao iniciar o app:\n'+((e&&e.message)||e)+'</pre>';
    }
  })();
</script>

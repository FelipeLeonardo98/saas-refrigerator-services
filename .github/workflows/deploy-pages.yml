name: Deploy PoC (GitHub Pages)

# Publica a pasta web/ (o PoC) como site público no GitHub Pages.
# Depois do primeiro push: Settings -> Pages -> Source: "GitHub Actions".
# URL pública: https://felipeleonardo98.github.io/saas-refrigerator-services/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
